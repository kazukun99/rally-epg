import datetime
        import xml.etree.ElementTree as ET

        def generate_epg():
            tv = ET.Element('tv')
            
            channels_info = [
                {'id': 'rally.tv', 'name_en': 'Rally.TV Live'},
                {'id': 'rally.tv.fast', 'name_en': 'Rally.TV FAST+'}
            ]
            
            for ch in channels_info:
                channel = ET.SubElement(tv, 'channel', id=ch['id'])
                ET.SubElement(channel, 'display-name', lang='en').text = ch_info if 'ch_info' in locals() else ch['name_en']
                ET.SubElement(channel, 'icon', src='https://rally.tv')

            # 日本時間の「今日」と「明日」の日付文字列を自動計算
            jst_now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
            today_str = jst_now.strftime('%Y%m%d')
            
            jst_tomorrow = jst_now + datetime.timedelta(days=1)
            tomorrow_str = jst_tomorrow.strftime('%Y%m%d')

            # ==========================================================
            # 【公式詳細スタイル・ステージスケジュール】
            # あのとき大お気に入りだった、細かいSSごとのタイムテーブルを完全再現！
            # ==========================================================
            is_rally_week = True  # ラリー開催中の切り替えフラグ

            if is_rally_week:
                schedule_rally_tv = [
                    # --- 【今日】の細かいスケジュール ---
                    {
                        'start': f'{today_str}080000 +0900',
                        'stop': f'{today_str}090000 +0900',
                        'title': 'WRC Live: Shakedown',
                        'desc': 'Official shakedown stage, testing setups before the rally starts.'
                    },
                    {
                        'start': f'{today_str}130000 +0900',
                        'stop': f'{today_str}143000 +0900',
                        'title': 'WRC Live: SS1 - Opening Super Special Stage',
                        'desc': 'The thrilling ceremonial start and first head-to-head showdown of the rally.'
                    },
                    {
                        'start': f'{today_str}180000 +0900',
                        'stop': f'{today_str}190000 +0900',
                        'title': 'WRC Daily Highlights & Day 1 Wrap-up',
                        'desc': 'Comprehensive review of today stages, interviews, and standings.'
                    },

                    # --- 【明日】の細かいスケジュール（先読み表示） ---
                    {
                        'start': f'{tomorrow_str}073000 +0900',
                        'stop': f'{tomorrow_str}090000 +0900',
                        'title': 'WRC Live: SS2 - Morning Loop Opener',
                        'desc': 'Day 2 kicks off with high-speed gravel and technical sections.'
                    },
                    {
                        'start': f'{tomorrow_str}110000 +0900',
                        'stop': f'{tomorrow_str}123000 +0900',
                        'title': 'WRC Live: SS3 - Mid-Morning Technical Test',
                        'desc': 'Challenging stages testing driver concentration and tyre management.'
                    },
                    {
                        'start': f'{tomorrow_str}130000 +0900',
                        'stop': f'{tomorrow_str}143000 +0900',
                        'title': 'WRC Live: Midday Service & Remote Fitting',
                        'desc': 'Service park action, mechanical repairs, and driver reactions.'
                    },
                    {
                        'start': f'{tomorrow_str}150000 +0900',
                        'stop': f'{tomorrow_str}163000 +0900',
                        'title': 'WRC Live: SS4 - Afternoon Decisive Loop',
                        'desc': 'The crucial afternoon rerun of the morning stages under fading light.'
                    }
                ]
            else:
                # --- オフウィーク（開催なし）：定番アーカイブ ---
                schedule_rally_tv = [
                    {
                        'start': f'{today_str}000000 +0900',
                        'stop': f'{today_str}240000 +0900',
                        'title': 'WRC 24/7 Archive & Classic Marathons (Today)',
                        'desc': 'Enjoy classic WRC highlights, historical seasons, and documentaries.'
                    },
                    {
                        'start': f'{tomorrow_str}000000 +0900',
                        'stop': f'{tomorrow_str}240000 +0900',
                        'title': 'WRC 24/7 Archive & Classic Marathons (Tomorrow)',
                        'desc': 'Enjoy classic Wrc highlights, historical seasons, and documentaries.'
                    }
                ]

            # FASTチャンネル用の番組
            schedule_fast = [
                {
                    'start': f'{today_str}000000 +0900',
                    'stop': f'{today_str}240000 +0900',
                    'title': 'WRC FAST+: Onboards & Historic Moments (Today)',
                    'desc': 'Non-stop historic rally action and onboard cameras.'
                },
                {
                    'start': f'{tomorrow_str}000000 +0900',
                    'stop': f'{tomorrow_str}240000 +0900',
                    'title': 'WRC FAST+: Onboards & Historic Moments (Tomorrow)',
                    'desc': 'Non-stop historic rally action and onboard cameras.'
                }
            ]

            def add_custom_programmes(ch_id, schedules):
                for p in schedules:
                    programme = ET.SubElement(tv, 'programme', 
                                                start=p['start'], 
                                                stop=p['stop'], 
                                                channel=ch_id)
                    ET.SubElement(programme, 'title', lang='en').text = p['title']
                    ET.SubElement(programme, 'desc', lang='en').text = p['desc']
                    ET.SubElement(programme, 'category', lang='en').text = 'Sports'

            add_custom_programmes('rally.tv', schedule_rally_tv)
            add_custom_programmes('rally.tv.fast', schedule_fast)

            tree = ET.ElementTree(tv)
            ET.indent(tree, space='  ', level=0)
            tree.write('epg.xml', encoding='utf-8', xml_declaration=True)
            print('Official detailed style EPG (Today + Tomorrow) generated successfully!')

        generate_epg()
