name: Update Rally.TV EPG

on:
  schedule:
    # 毎日日本時間の午前6時（UTC 21:00）に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Extract Rally.TV EPG
      run: |
        python -c "
        import urllib.request
        import xml.etree.ElementTree as ET

        # 毎日確実に更新されている iptv-org の最新EPG（us.xml）を使用
        url = 'https://github.io'
        print('Downloading latest EPG from iptv-org...')
        req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
        
        try:
            with urllib.request.urlopen(req) as response:
                xml_data = response.read()
        except Exception as e:
            print(f'Error downloading file: {e}')
            exit(1)

        print('Parsing XML data...')
        root = ET.fromstring(xml_data)

        # 新しい空のXMLTV構造を作成
        new_root = ET.Element('tv')

        # 1. チャンネル定義の追加（あなたのM3Uのtvg-idに合わせる）
        ch1 = ET.SubElement(new_root, 'channel', id='rally.tv')
        ET.SubElement(ch1, 'display-name', lang='en').text = 'Rally.TV Live'
        ET.SubElement(ch1, 'icon', src='https://rally.tv')

        ch2 = ET.SubElement(new_root, 'channel', id='rally.tv.fast')
        ET.SubElement(ch2, 'display-name', lang='en').text = 'Rally.TV FAST+'
        ET.SubElement(ch2, 'icon', src='https://rally.tv')

        # 2. 番組情報の抽出とマッピング
        # iptv-org側で稼働している「RallyTV.us」の番組データを取得
        count = 0
        for prog in root.findall('programme'):
            if prog.get('channel') == 'RallyTV.us':
                # メインのRally.TV Live用にIDを書き換えて追加
                prog_live = ET.Element('programme', start=prog.get('start'), stop=prog.get('stop'), channel='rally.tv')
                for elem in prog:
                    prog_live.append(elem)
                new_root.append(prog_live)

                # FAST+用にも同じ番組スケジュールを割り当て
                prog_fast = ET.Element('programme', start=prog.get('start'), stop=prog.get('stop'), channel='rally.tv.fast')
                for elem in prog:
                    prog_fast.append(elem)
                new_root.append(prog_fast)
                count += 1

        print(f'Extracted {count} programmes for Rally.TV from iptv-org source.')

        # ファイルに書き出し
        tree = ET.ElementTree(new_root)
        ET.indent(tree, space='  ', level=0)
        tree.write('epg.xml', encoding='utf-8', xml_declaration=True)
        "

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add epg.xml
        if git diff --staged --quiet; then
          echo "No changes in epg.xml"
        else
          git commit -m "Automated EPG Update via iptv-org [skip ci]"
          git push
        fi
