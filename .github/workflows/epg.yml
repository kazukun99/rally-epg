name: Update Rally.TV EPG & Playlists

on:
  schedule:
    - cron: '0 * * * *'  # 1時間に1回自動実行
  workflow_dispatch:      # 手動でもいつでも実行できるようにするよ

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 必要な依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: 4. デュアルチャンネル番組表生成スクリプトの実行 (JST・番組データ連動)
        run: |
          python make_dual_playlist.py
        env:
          RALLY_COOKIE: ${{ secrets.RALLY_COOKIE }}

      - name: 5. 生成・更新されたプレイリスト・番組表ファイルを自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 生成される可能性のある m3u や xml などの成果物をステージング
          git add *.m3u *.xml 2>/dev/null || true
          
          # 変更がある場合のみ自動でコミット＆プッシュするよ
          git diff --staged --quiet || (git commit -m "Auto-update EPG & Playlists: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }})
