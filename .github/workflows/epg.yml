name: Update Rally.TV EPG

on:
  schedule:
    # 毎日日本時間の午前6時（UTC 21:00）に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Extract Rally.TV EPG via Regex
      run: |
        python -c "
        import urllib.request
        import re

        url = 'https://github.io'
        print('Downloading latest EPG from iptv-org...')
        req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
        
        try:
            with urllib.request.urlopen(req) as response:
                content = response.read().decode('utf-8', errors='ignore')
        except Exception as e:
            print(f'Error downloading file: {e}')
            exit(1)

        print('Extracting Rally.TV programmes via Text Scan...')
        
        # 正規表現で RallyTV.us の番組ブロックをすべて抽出
        pattern = re.compile(r'(<programme\s+[^>]*channel=\"RallyTV\.us\"[^>]*>.*?</programme>)', re.DOTALL)
        matches = pattern.findall(content)

        print(f'Found {len(matches)} programmes.')

        # 新しい XMLTV 形式を構築
        output = []
        output.append('<?xml version=\"1.0\" encoding=\"UTF-8\"?>')
        output.append('<tv>')
        
        # 1. チャンネル定義の追加（あなたのM3UのIDに完全一致させる）
        output.append('  <channel id=\"rally.tv\">')
        output.append('    <display-name lang=\"en\">Rally.TV Live</display-name>')
        output.append('    <icon src=\"https://rally.tv\" />')
        output.append('  </channel>')
        output.append('  <channel id=\"rally.tv.fast\">')
        output.append('    <display-name lang=\"en\">Rally.TV FAST+</display-name>')
        output.append('    <icon src=\"https://rally.tv\" />')
        output.append('  </channel>')

        # 2. 番組情報のマッピング（IDを rally.tv と rally.tv.fast に書き換え）
        for prog in matches:
            # メインチャンネル用に書き換え
            prog_live = prog.replace('channel=\"RallyTV.us\"', 'channel=\"rally.tv\"')
            output.append('  ' + prog_live)
            
            # FAST+チャンネル用にも同じ番組をコピーして書き換え
            prog_fast = prog.replace('channel=\"RallyTV.us\"', 'channel=\"rally.tv.fast\"')
            output.append('  ' + prog_fast)

        output.append('</tv>')

        # epg.xml として保存
        with open('epg.xml', 'w', encoding='utf-8') as f:
            f.write('\n'.join(output))
        print('epg.xml successfully generated!')
        "

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add epg.xml
        if git diff --staged --quiet; then
          echo "No changes in epg.xml"
        else
          git commit -m "Perfect Automated EPG Update [skip ci]"
          git push
        fi

          git commit -m "Perfect Automated EPG Update [skip ci]"
          git push
        fi
