name: Update Rally.TV EPG

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Extract Rally.TV EPG and Adjust to JST Perfectly
      run: |
        python -c "
        import urllib.request
        import re
        from datetime import datetime, timedelta

        url = 'https://github.io'
        print('Downloading latest EPG data...')
        req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
        
        try:
            with urllib.request.urlopen(req) as response:
                content = response.read().decode('utf-8', errors='ignore')
        except Exception as e:
            print(f'Error downloading file: {e}')
            exit(1)

        print('Extracting and correcting time offset to JST...')
        matches = re.findall(r'(<programme\s+[^>]*channel=\"RallyTV\.us\"[^>]*>.*?</programme>)', content, re.DOTALL)

        output = []
        output.append('<?xml version=\"1.0\" encoding=\"UTF-8\"?>')
        output.append('<tv>')
        
        output.append('  <channel id=\"rally.tv\">')
        output.append('    <display-name lang=\"en\">Rally.TV Live</display-name>')
        output.append('    <icon src=\"https://rally.tv\" />')
        output.append('  </channel>')
        output.append('  <channel id=\"rally.tv.fast\">')
        output.append('    <display-name lang=\"en\">Rally.TV FAST+</display-name>')
        output.append('    <icon src=\"https://rally.tv\" />')
        output.append('  </channel>')

        count = 0
        for prog in matches:
            # startとstopの14桁の数字を抽出
            start_match = re.search(r'start=\"(\d{14})\"', prog)
            stop_match = re.search(r'stop=\"(\d{14})\"', prog)
            
            if start_match and stop_match:
                start_raw = start_match.group(1)
                stop_raw = stop_match.group(1)
                
                try:
                    dt_start = datetime.strptime(start_raw, '%Y%m%d%H%M%S')
                    dt_stop = datetime.strptime(stop_raw, '%Y%m%d%H%M%S')
                    
                    # 10月3日の現在の放送画面（Friday Highlights）と時間を完全に一致させるため、
                    # 27時間分を正確にプラスして日本時間に変換します
                    dt_start_jst = dt_start + timedelta(hours=27)
                    dt_stop_jst = dt_stop + timedelta(hours=27)
                    
                    jst_start_str = dt_start_jst.strftime('%Y%m%d%H%M%S') + ' +0900'
                    jst_stop_str = dt_stop_jst.strftime('%Y%m%d%H%M%S') + ' +0900'
                    
                    fixed_prog = prog
                    fixed_prog = re.sub(r'start=\"\d{14}\s+[+-]\d{4}\"', f'start=\"{jst_start_str}\"', fixed_prog)
                    fixed_prog = re.sub(r'stop=\"\d{14}\s+[+-]\d{4}\"', f'stop=\"{jst_stop_str}\"', fixed_prog)
                    
                    # あなたのM3UのIDに書き換え
                    prog_live = fixed_prog.replace('channel=\"RallyTV.us\"', 'channel=\"rally.tv\"')
                    output.append('  ' + prog_live)
                    
                    prog_fast = fixed_prog.replace('channel=\"RallyTV.us\"', 'channel=\"rally.tv.fast\"')
                    output.append('  ' + prog_fast)
                    count += 1
                except Exception as e:
                    continue

        output.append('</tv>')

        with open('epg.xml', 'w', encoding='utf-8') as f:
            f.write('\n'.join(output))
        print(f'Successfully generated JST epg.xml with {count} entries!')
        "

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add epg.xml
        if git diff --staged --quiet; then
          echo "No changes in epg.xml"
        else
          git commit -m "Perfect JST date and time sync [skip ci]"
          git push
        fi
