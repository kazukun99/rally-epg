name: Update Rally.TV EPG

on:
  schedule:
    - cron: '0 * * * *'  # 1時間に1回自動実行
  workflow_dispatch:      # 手動でもいつでも実行できるようにするよ

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. EPG生成スクリプトの実行
        run: |
          python make_epg.py
        env:
          # 必要に応じてGitHub Secretsからクッキーを渡せるようにしておくよ
          RALLY_COOKIE: ${{ secrets.RALLY_COOKIE }}

      - name: 4. 生成・更新された epg.xml を自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          # 変更がある場合のみ自動でコミット＆プッシュするよ
          git diff --staged --quiet || (git commit -m "Auto-update EPG: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && git push)
