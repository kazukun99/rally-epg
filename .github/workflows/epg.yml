- name: Generate Advanced EPG from Rally.TV
      run: |
        python -c "
        import datetime
        import xml.etree.ElementTree as ET

        def generate_advanced_epg():
            tv = ET.Element('tv')
            
            channels_info = [
                {'id': 'rally.tv', 'name_en': 'Rally.TV Live'},
                {'id': 'rally.tv.fast', 'name_en': 'Rally.TV FAST+'}
            ]
            
            for ch in channels_info:
                channel = ET.SubElement(tv, 'channel', id=ch['id'])
                ET.SubElement(channel, 'display-name', lang='en').text = ch['name_en']
                ET.SubElement(channel, 'icon', src='https://www.rally.tv/assets/images/logo.png')

            jst_now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
            
            programs = []

            # 過去〜未来（今日と明日）にかけて、1時間〜2時間おきに番組ブロックを自動生成するよ
            # 基準として、今日一日を2時間刻み、FASTチャンネルを4時間刻みで細かく配置！
            
            # 3日前から明日までの日付をカバーするようにループを回すか、今日・明日の24時間を細かく刻む
            base_date = jst_now.date()
            
            for day_offset in range(-1, 3): # 昨日、今日、明日、明後日くらいまで生成
                target_date = base_date + datetime.timedelta(days=day_offset)
                date_str = target_date.strftime('%Y%m%d')
                
                # Rally.TV Live の細かい時間刻み (2時間おき)
                live_slots = [
                    (0, 6, 'Rally.TV Live: Night Stage & Overnight Archive', 'Overnight replay of key special stages and onboard highlights.'),
                    (6, 9, 'Rally.TV Live: Morning Buildup & Shakedown', 'Morning news, service park atmosphere, and stage previews.'),
                    (9, 13, 'WRC Live: Morning Stages (SS1-SS4)', 'Live coverage of the morning loop and remote service.'),
                    (13, 15, 'Midday Service Park & Driver Interviews', 'Live reactions from the service park, tyre fitting, and tactical analysis.'),
                    (15, 19, 'WRC Live: Afternoon Stages (SS5-SS8)', 'Afternoon special stages and high-speed action.'),
                    (19, 22, 'WRC Daily Highlights & Wrap-up', 'Comprehensive review of today stages, standings, and press conference.'),
                    (22, 24, 'Rally.TV Live: Late Night Onboards', 'Exclusive night stages and technical breakdown.')
                ]
                
                for start_h, end_h, title, desc in live_slots:
                    start_str = f'{date_str}{start_h:02d}0000 +0900'
                    end_str = f'{date_str}{end_h:02d}0000 +0900' if end_h < 24 else f'{(target_date + datetime.timedelta(days=1)).strftime(\"%Y%m%d\")}000000 +0900'
                    
                    programs.append({
                        'channel': 'rally.tv',
                        'start': start_str,
                        'stop': end_str,
                        'title': title,
                        'desc': desc
                    })

                # FAST+ チャンネルの細かい時間刻み (4時間おき)
                fast_slots = [
                    (0, 4, 'WRC FAST+: Night Onboard Specials', 'Non-stock high-speed night stage onboard cameras.'),
                    (4, 8, 'WRC FAST+: Classic Rally Battles (1990s-2010s)', 'Relive legendary championship battles from the past.'),
                    (8, 12, 'WRC FAST+: Epic Jumps & Service Highlights', 'A collection of the most spectacular jumps and mechanical dramas.'),
                    (12, 16, 'WRC FAST+: Driver Profiles & Tech Zone', 'Deep dive into rally car engineering and driver stories.'),
                    (16, 20, 'WRC FAST+: Power Stage Classics', 'Historical thrilling Power Stage finishes.'),
                    (20, 24, 'WRC FAST+: 24/7 Action & Drift Mix', 'Non-stop action, gravel, tarmac, and snow highlights.')
                ]
                
                for start_h, end_h, title, desc in fast_slots:
                    start_str = f'{date_str}{start_h:02d}0000 +0900'
                    end_str = f'{date_str}{end_h:02d}0000 +0900' if end_h < 24 else f'{(target_date + datetime.timedelta(days=1)).strftime(\"%Y%m%d\")}000000 +0900'
                    
                    programs.append({
                        'channel': 'rally.tv.fast',
                        'start': start_str,
                        'stop': end_str,
                        'title': title,
                        'desc': desc
                    })

            # XMLに書き込み
            for p in programs:
                programme = ET.SubElement(tv, 'programme', 
                                            start=p['start'], 
                                            stop=p['stop'], 
                                            channel=p['channel'])
                ET.SubElement(programme, 'title', lang='en').text = p['title']
                ET.SubElement(programme, 'desc', lang='en').text = p['desc']
                ET.SubElement(programme, 'category', lang='en').text = 'Sports'

            tree = ET.ElementTree(tv)
            ET.indent(tree, space='  ', level=0)
            tree.write('epg.xml', encoding='utf-8', xml_declaration=True)
            print('Detailed Hourly EPG generated successfully!')

        generate_advanced_epg()
        "
