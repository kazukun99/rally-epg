name: Update Rally.TV EPG & Playlists

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 必要な依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: 4. HTMLを取得
        run: |
          python fetch_page_source.py
        env:
          RALLY_COOKIE: ${{ secrets.RALLY_COOKIE }}

      - name: 5. EPGを生成
        run: |
          python make_epg.py

      - name: 6. 生成ファイルを自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add *.xml *.txt *.m3u 2>/dev/null || true

          git diff --staged --quiet || (
            git commit -m "Auto-update EPG & Playlists: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          )
