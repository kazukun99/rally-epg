name: Test Rally.TV Scraper

on:
  workflow_dispatch: # 手動でいつでもテスト実行できるボタン

jobs:
  test-scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Rally.TV Test Script
      run: |
        python -c "
        import requests

        TARGET_URL = 'https://rally.tv/en/epg?view=grid'
        headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
        }

        print('🔍 Rally.TVへ接続してデータを探しています……')
        try:
            response = requests.get(TARGET_URL, headers=headers, timeout=10)
            print(f'ステータスコード: {response.status_code}')

            if response.status_code == 200:
                print(f'✨ 接続成功！ ページのHTMLやデータが取得できました（長さ: {len(response.text)} 文字）')
                # もしページの中にJSONデータや特定のキーワードがあるか軽くチェック
                if 'WRC' in response.text:
                    print('🎯 ページ内に「WRC」のキーワードを見つけたよ！')
                else:
                    print('💡 ページは取得できたけど、JavaScriptで動的にデータを読み込んでいるタイプかも？')
            else:
                print('⚠️ アクセスがブロックされたか、URLが違うみたい……')

        except Exception as e:
            print(f'❌ エラーが発生しちゃった: {e}')
        "
