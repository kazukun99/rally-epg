name: Update Rally.TV EPG & Playlists

on:
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 必要な依存ライブラリのインストール
        run: |
          pip install requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: 4. HTMLを取得
        run: |
          python fetch_page_source.py
          python fetch_page_source_fast.py
        env:
          RALLY_COOKIE: ${{ secrets.RALLY_COOKIE }}

      - name: 5. EPGを生成
        run: |
          python make_epg.py
                    
      - name: 6. epg.xml を保存
        uses: actions/upload-artifact@v4
        with:
          name: epg-xml
          path: epg.xml

      - name: 7. epg_cleaned.txt を保存
        uses: actions/upload-artifact@v4
        with:
          name: epg-cleaned
          path: epg_cleaned.txt

      - name: 8. page_source.html を保存
        uses: actions/upload-artifact@v4
        with:
          name: page-source
          path: page_source.html

      - name: 9. epg.xml をコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update epg.xml"
          git push
