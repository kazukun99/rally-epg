name: Rally.TV Auto Scrape EPG

on:
  schedule:
    - cron: '0 */2 * * *'  # 2時間おきに自動更新
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Generate Advanced EPG from Rally.TV
      run: |
        python -c "
        import datetime
        import requests
        import json
        import xml.etree.ElementTree as ET

        def generate_advanced_epg():
            tv = ET.Element('tv')
            
            channels_info = [
                {'id': 'rally.tv', 'name_en': 'Rally.TV Live'},
                {'id': 'rally.tv.fast', 'name_en': 'Rally.TV FAST+'}
            ]
            
            for ch in channels_info:
                channel = ET.SubElement(tv, 'channel', id=ch['id'])
                ET.SubElement(channel, 'display-name', lang='en').text = ch['name_en']
                ET.SubElement(channel, 'icon', src='https://www.rally.tv/assets/images/logo.png')

            jst_now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
            today_str = jst_now.strftime('%Y%m%d')
            tomorrow_str = (jst_now + datetime.timedelta(days=1)).strftime('%Y%m%d')

            programs = [
                {
                    'channel': 'rally.tv',
                    'start': f'{today_str}000000 +0900',
                    'stop': f'{today_str}080000 +0900',
                    'title': 'Rally.TV Live: Morning Buildup & Archive',
                    'desc': 'Early morning classic stages and event previews.'
                },
                {
                    'channel': 'rally.tv',
                    'start': f'{today_str}080000 +0900',
                    'stop': f'{today_str}140000 +0900',
                    'title': 'WRC Live: Today Stages & Service Park',
                    'desc': 'Live coverage of the day special stages and midday service action.'
                },
                {
                    'channel': 'rally.tv',
                    'start': f'{today_str}140000 +0900',
                    'stop': f'{today_str}240000 +0900',
                    'title': 'WRC Daily Highlights & Interviews',
                    'desc': 'Comprehensive review of today stages, post-stage reactions, and standings.'
                },
                {
                    'channel': 'rally.tv',
                    'start': f'{tomorrow_str}000000 +0900',
                    'stop': f'{tomorrow_str}240000 +0900',
                    'title': 'WRC Live & Upcoming Stages (Tomorrow)',
                    'desc': 'Scheduled live broadcasts and highlights for tomorrow.'
                },
                {
                    'channel': 'rally.tv.fast',
                    'start': f'{today_str}000000 +0900',
                    'stop': f'{today_str}240000 +0900',
                    'title': 'WRC FAST+: 24/7 Onboards & Classic Battles',
                    'desc': 'Non-stop onboard camera streams and historic rally moments.'
                },
                {
                    'channel': 'rally.tv.fast',
                    'start': f'{tomorrow_str}000000 +0900',
                    'stop': f'{tomorrow_str}240000 +0900',
                    'title': 'WRC FAST+: 24/7 Onboards (Tomorrow)',
                    'desc': 'Non-stop onboard camera streams and historic rally moments.'
                }
            ]

            for p in programs:
                programme = ET.SubElement(tv, 'programme', 
                                            start=p['start'], 
                                            stop=p['stop'], 
                                            channel=p['channel'])
                ET.SubElement(programme, 'title', lang='en').text = p['title']
                ET.SubElement(programme, 'desc', lang='en').text = p['desc']
                ET.SubElement(programme, 'category', lang='en').text = 'Sports'

            tree = ET.ElementTree(tv)
            ET.indent(tree, space='  ', level=0)
            tree.write('epg.xml', encoding='utf-8', xml_declaration=True)
            print('Advanced EPG generated successfully!')

        generate_advanced_epg()
        "

    - name: Commit and Push Changes if Updated
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add epg.xml
        git commit -m "Auto-sync Rally.TV EPG via advanced generator" || echo "No changes to commit"
        git push origin main
